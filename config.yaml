worker:
  detector: onnx
  linq: {transport: cloud, broker: 10.0.114.30, port: 5672, program_dir: "/auto/cache/{login}", timeout_s: 20, batch: 8, raw: true}
  precision: auto
  ppe_fps: 6  # больше 6 на cpu не тянет
  hazard_fps: 1
  crop_pass:
    cigarette: {enabled: true, max_per_tick: 6, top_fraction: 0.6, margin: 0.2}
    head: {enabled: true, max_per_frame: 4, top_fraction: 0.5, margin: 0.15, max_person_height_px: 200}
  decode: {backend: ffmpeg, width: 1280, hwaccel: auto}
  overlay_delay_ms: 0
  tiles: true  # головы на широком кадре мелкие, модель голов гоняем по двум квадратам кадра
  fake_scenario: null

evidence:
  pre_seconds: 5
  post_seconds: 5
  clip_width: 1280

# дефолты, потом правятся из ui
rules:
  no_helmet: {window_s: 4, min_observations: 12, fraction: 0.6}
  no_mask: {window_s: 4, min_observations: 12, fraction: 0.6}
  no_vest: {window_s: 6, min_observations: 15, max_fraction: 0.1, min_person_height_px: 120}
  zone_intrusion: {window_s: 1.5, fraction: 0.7, min_observations: 4}
  smoking: {k: 3, m: 5, upper_fraction: 0.33, everywhere: true}  # везде кроме курилок
  fire: {k: 3, m: 5}
  smoke: {k: 3, m: 5}
  running: {window_s: 2, min_observations: 6, fraction: 0.6, speed_heights_s: 1.5}
  vehicle_proximity: {window_s: 1.5, min_observations: 4, fraction: 0.7, distance_heights: 1.0, min_vehicle_speed: 0.1}
  fall: {window_s: 1.5, min_observations: 2, upright_ratio: 1.3, lying_ratio: 1.0, drop_heights: 0.2}
  lying_immobile: {window_s: 6, min_observations: 12, fraction: 0.7, lying_ratio: 1.0, max_speed: 0.1, spot_fraction: 0.5, spot_radius: 0.5}  # 10 с и 90% не ловили ни одного лежачего: рамка лежащего мерцает
  phone_usage: {window_s: 3, min_observations: 6, fraction: 0.5, upper_fraction: 0.6}
  barrier_crossing: {window_s: 3, min_observations: 3}
  under_load: {window_s: 1.5, fraction: 0.7, min_observations: 4}
  no_harness: {window_s: 4, min_observations: 8, max_fraction: 0.2}
  unsafe_carry: {window_s: 2, min_observations: 6, fraction: 0.6, min_speed_heights_s: 0.3}
  lifecycle:
    close_after_s: 5
    cooldown_s: 60
    retrack_iou: 0.3  # чтоб не плодить события когда трекер теряет id
    retrack_window_s: 120
    retrack_dist_heights: 0.5  # трек пропал, а рядом новый с тем же нарушением - это он же
    camera_cooldown_s: 60
    track_lost_s: 2

telegram:
  instant_min_severity: high
  min_interval_s: 1
  summary_interval_s: 60
  repeat_interval_s: 300
