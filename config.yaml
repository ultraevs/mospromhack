worker:
  detector: onnx
  ppe_fps: 6  # больше 6 на cpu не тянет
  hazard_fps: 1
  crop_pass:
    cigarette: {enabled: true, max_per_tick: 6, top_fraction: 0.6, margin: 0.2}
    head: {enabled: false, max_per_frame: 4, top_fraction: 0.5, margin: 0.15, max_person_height_px: 200}
  overlay_delay_ms: 0
  fake_scenario: null

evidence:
  pre_seconds: 5
  post_seconds: 5
  clip_width: 1280

# дефолты, потом правятся из ui
rules:
  no_helmet: {window_s: 4, min_observations: 8, fraction: 0.35}
  no_mask: {window_s: 4, min_observations: 8, fraction: 0.35}
  no_vest: {window_s: 6, min_observations: 15, max_fraction: 0.1, min_person_height_px: 120}
  zone_intrusion: {window_s: 1.5, fraction: 0.7}
  smoking: {k: 2, m: 5}
  fire: {k: 3, m: 5}
  smoke: {k: 3, m: 5}
  lifecycle:
    close_after_s: 5
    cooldown_s: 60
    retrack_iou: 0.3  # чтоб не плодить события когда трекер теряет id
    retrack_window_s: 10
    camera_cooldown_s: 60
