# Всё, что не секрет. Секреты и порты лежат в .env.

worker:
  detector: onnx            # onnx | linq | fake
  ppe_fps: 6                # кадров в секунду на камеру для ppe
  hazard_fps: 1
  crop_pass:
    cigarette: {enabled: true, max_per_tick: 6, top_fraction: 0.6, margin: 0.2}
    head: {enabled: false, max_per_frame: 4, top_fraction: 0.5, margin: 0.15, max_person_height_px: 200}
  overlay_delay_ms: 0
  fake_scenario: null       # путь к yaml со сценарием для detector: fake

evidence:
  pre_seconds: 5
  post_seconds: 5
  clip_width: 1280

# Параметры правил по умолчанию. Копируются в БД при первом запуске, дальше редактируются из интерфейса.
rules:
  no_helmet: {window_s: 4, min_observations: 8, fraction: 0.35}
  no_mask: {window_s: 4, min_observations: 8, fraction: 0.35}
  no_vest: {window_s: 6, min_observations: 15, max_fraction: 0.1, min_person_height_px: 120}
  zone_intrusion: {window_s: 1.5, fraction: 0.7}
  smoking: {k: 2, m: 5}
  fire: {k: 3, m: 5}
  smoke: {k: 3, m: 5}
  lifecycle:
    close_after_s: 5          # событие закрывается, если условие не выполняется столько секунд
    cooldown_s: 60            # пауза до нового события того же типа для того же трека
    retrack_iou: 0.3          # защита от смены track_id: порог пересечения рамок
    retrack_window_s: 10      # ...с событием, открытым или закрытым не раньше стольких секунд назад
    camera_cooldown_s: 60     # пауза на камеру для fire и smoke
