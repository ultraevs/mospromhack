logLevel: info
logDestinations: [stdout]

# через api бэк добавляет rtsp камеры
api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189

rtmp: no

# для прокси без webrtc (VIDEO_MODE=hls)
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsVariant: mpegts
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsAlwaysRemux: no
srt: no
moq: no

# file камеры пушит ffmpeg в cam-N, rtsp добавляются через api
paths:
  all_others:
