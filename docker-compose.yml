name: safety

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    restart: unless-stopped
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${WEBRTC_HOST:-127.0.0.1}
    ports:
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      - "${MEDIAMTX_HLS_PORT:-8888}:8888"
      - "8189:8189/udp"
      - "8189:8189/tcp"
      - "${MEDIAMTX_RTSP_PORT:-8554}:8554"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on: [mediamtx]
    environment:
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_ENABLED: ${MAX_ENABLED:-true}
      MAX_API_URL: ${MAX_API_URL:-https://platform-api2.max.ru}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
      AUTH_ADMIN_LOGIN: ${AUTH_ADMIN_LOGIN:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin1234}
      AUTH_VIEWER_LOGIN: ${AUTH_VIEWER_LOGIN:-viewer}
      AUTH_VIEWER_PASSWORD: ${AUTH_VIEWER_PASSWORD:-viewer1234}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      MEDIAMTX_HOST: mediamtx
      MEDIAMTX_WEBRTC_PORT: ${MEDIAMTX_WEBRTC_PORT:-8889}
      STREAM_CODEC: ${STREAM_CODEC:-h264}
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
      BACKEND_HOST: backend
    volumes:
      - ./models:/app/models:ro
      - ./config.yaml:/app/config.yaml:ro

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${FRONTEND_PORT:-5173}:80"
